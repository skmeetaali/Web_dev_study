<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelector</title>
    <script>
        function greetings() {
            let headings = document.querySelector('h1');
            if (headings.innerHTML === 'Hello') {
                headings.innerHTML = 'Goodbye!!'
            }
            else {
                headings.innerHTML = 'Hello'
            }
        }
    </script>
</head>

<body>
    <h1>Hello</h1>
    <button onclick="greetings()">change greeings</button>
</body>

</html>
