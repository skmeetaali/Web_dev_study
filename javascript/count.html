<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count</title>
    <script>
        let counter = 0;
        function count() {
            let heading = document.querySelector('h1');
            counter += 1;
            heading.innerHTML = counter;
            if (counter % 10 === 0) {
                alert(`Counter is ${counter}`);
            }
        }
    </script>
</head>

<body>
    <h1>hey</h1>
    <button onclick="count()">click</button>
</body>

</html>
